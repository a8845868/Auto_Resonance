[project]
name = "Auto_Resonance"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Night-stars-1", email = "nujj1042633805@gmail.com"},
]
dependencies = [
    "Pillow==12.1.1",
    "loguru==0.7.2",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "orjson>=3.10.0",
    "pydantic>=2.6.4",
    "watchdog>=4.0.0",
    "adb-shell>=0.4.4",
    "onnxocr-ppocrv4>=0.0.5",
    "requests>=2.32.4",
    "psutil>=7.0.0",
    "PySide6-Fluent-Widgets[full]>=1.8.3",
    "onnxruntime>=1.22.1"
]
requires-python = "<3.13,>=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
ocr-v6-cpu = [
    "paddleocr>=3.5,<4",
    "paddlepaddle>=3.2,<4",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
build-updater = "pdm run pyinstaller -F --distpath ./dist/updater -i app/resource/images/logo.ico -n 'HeiYue Updater' updater.py -y"

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=8.1.1",
    "pyinstaller==6.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_worktrees", ".git", ".venv"]
addopts = ["--ignore=tests/tests"]
